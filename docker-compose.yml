services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: online-course-app:latest
    container_name: online_course_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - course_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:1.25-alpine
    container_name: online_course_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - course_network
    depends_on:
      - app

  queue:
    image: online-course-app:latest
    pull_policy: never
    container_name: online_course_queue
    user: www-data
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    networks:
      - course_network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: online_course_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: online_course
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_user -d online_course"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - course_network

  redis:
    image: redis:7-alpine
    container_name: online_course_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - course_network

volumes:
  postgres_data:
  redis_data:

networks:
  course_network:
    driver: bridge
